<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melodic Dictation Tool</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    button {
      padding: 20px 40px;
      font-size: 1.2rem;
      border: none;
      border-radius: 50px;
      background-color: #2563eb;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
    }
    button.recording {
      background-color: #dc2626;
      box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
    }
    #status {
      margin-top: 20px;
      font-size: 1.1rem;
      color: #94a3b8;
    }
  </style>
  <!-- CDN Pitchfinder for YIN pitch detection -->
  <script src="https://cdn.jsdelivr.net/npm/pitchfinder@2.3.2/dist/pitchfinder.min.js"></script>
</head>
<body>

  <button id="recordBtn">Activate microphone</button>
  <p id="status">Click on button to sing</p>
  <button id="repeatBtn" style="display: none; background-color: #475569; margin-top: 15px;">🔊 Répéter la dictée</button>
  <p id="status">Appuie sur le bouton pour chanter</p>

  <script type="module" src="./app.js"></script>
</body>
</html>
